<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>키캡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main aria-label="키캡 클릭커">
    <div class="coin-counter" aria-label="보유 코인"><span class="coin-icon" aria-hidden="true">C</span><span id="coins">0</span><span class="coin-label">코인</span></div>
    <div class="key-space">
      <div class="shadow" aria-hidden="true"></div>
      <button class="key" type="button" aria-label="스페이스바 키캡 누르기. 스페이스바 또는 엔터로도 누를 수 있습니다.">
        <svg viewBox="0 0 720 180" aria-hidden="true">
          <defs>
            <linearGradient id="body" x1="0" y1="0" x2="0.7" y2="1">
              <stop stop-color="#f0eee8"/>
              <stop offset=".48" stop-color="#aaa79f"/>
              <stop offset="1" stop-color="#5d5b56"/>
            </linearGradient>
            <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="#ccc9bf"/>
              <stop offset="1" stop-color="#807d75"/>
            </linearGradient>
            <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#fffef8"/>
              <stop offset=".45" stop-color="#e9e6db"/>
              <stop offset="1" stop-color="#bdb9ad"/>
            </linearGradient>
            <radialGradient id="dish" cx=".58" cy=".66" r=".85">
              <stop stop-color="#d5d2c7"/>
              <stop offset=".65" stop-color="#e9e6dd"/>
              <stop offset="1" stop-color="#fffef7"/>
            </radialGradient>
            <linearGradient id="glaze" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="white" stop-opacity=".65"/>
              <stop offset=".5" stop-color="white" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M47 33 Q49 22 64 22 H656 Q671 22 673 33 L701 141 Q705 160 686 160 H34 Q15 160 19 141Z" fill="#25241f"/>
          <path d="M47 29 Q49 18 64 18 H656 Q671 18 673 29 L701 135 Q705 154 686 154 H34 Q15 154 19 135Z" fill="url(#body)"/>
          <path d="M32 108 Q34 119 50 120 H670 Q686 119 688 108 L701 135 Q705 154 686 154 H34 Q15 154 19 135Z" fill="url(#front)"/>
          <path d="M47 29 Q49 18 64 18 H656 Q671 18 673 29 L688 104 Q691 121 672 122 H48 Q29 121 32 104Z" fill="url(#rim)"/>
          <path d="M61 35 Q63 29 75 29 H645 Q657 29 659 35 L672 97 Q674 107 661 108 H59 Q46 107 48 97Z" fill="url(#dish)"/>
          <path d="M49 29 Q51 20 65 20 H655 Q669 20 671 29" fill="none" stroke="#fffef9" stroke-opacity=".8" stroke-width="2"/>
          <path d="M51 94 L63 39 Q64 32 78 32 H641" fill="none" stroke="url(#glaze)" stroke-width="3" stroke-linecap="round"/>
          <path d="M52 123 H668" stroke="#f7f3e6" stroke-opacity=".3" stroke-width="1.5"/>
        </svg>
      </button>
    </div>
    <output class="sr-only" aria-live="polite" aria-atomic="true"></output>
  </main>
  <div class="audio-controls" role="group" aria-label="소리 설정">
    <button id="mute-audio" type="button" aria-pressed="false">음소거</button>
    <label for="volume">볼륨</label>
    <input id="volume" type="range" min="0" max="100" step="1" value="100">
    <span id="volume-value">100%</span>
  </div>
  <nav class="game-menu" aria-label="게임 메뉴"><button id="open-shop" type="button">상점</button><button id="open-inventory" type="button">인벤토리</button></nav>
  <dialog id="collection" aria-labelledby="panel-title">
    <header class="panel-header"><h1 id="panel-title">상점</h1><button id="close-panel" type="button" aria-label="닫기">닫기</button></header>
    <div class="category-buttons" role="group" aria-label="상품 종류"><button id="category-sound" type="button" aria-pressed="true">소리</button><button id="category-skin" type="button" aria-pressed="false">스킨</button></div>
    <p id="panel-info"></p>
    <p class="panel-balance">보유 <span id="panel-coins">0</span> 코인</p>
    <div id="sound-list"></div>
    <p id="shop-message" role="status"></p>
  </dialog>
  <script src="store.js"></script>
  <script src="game.js"></script>
</body>
</html>
